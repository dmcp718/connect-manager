[project]
name = "connect-bootstrap"
version = "0.1.0"
description = "Operator-facing wizard TUI for the CONNECT Manager aws-fargate stack."
requires-python = ">=3.12"
dependencies = [
    "textual>=0.83.0",
    "boto3>=1.34.0",
    "httpx>=0.26.0",
]

[project.scripts]
connect-bootstrap = "connect_bootstrap.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "connect_bootstrap",
    "connect_bootstrap.screens",
    "connect_bootstrap.widgets",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-textual-snapshot>=1.0.0",
    "ruff>=0.15.12",
    "mypy>=1.20.2",
    "pytest-cov>=7.1.0",
    "coverage>=7.13.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
