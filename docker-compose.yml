services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      - DATA_DIR=/data
      - LL_API_HOST=${LL_API_HOST:-https://admin-api.solutions-eng.online/api/v1}
      # Authentication - override JWT_SECRET_KEY in production!
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-change-in-production}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    volumes:
      - app-data:/data
    depends_on:
      valkey:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  worker:
    build: .
    environment:
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      - DATA_DIR=/data
      - ARQ_MAX_JOBS=4
      - LL_API_HOST=${LL_API_HOST:-https://admin-api.solutions-eng.online/api/v1}
    volumes:
      - app-data:/data
    depends_on:
      valkey:
        condition: service_healthy
      web:
        condition: service_healthy
    command: arq services.worker.WorkerSettings
    restart: unless-stopped
    deploy:
      replicas: 2  # Run 2 worker instances for parallel processing

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    command: valkey-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  app-data:
  valkey-data:
