services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      - DATA_DIR=/data
    volumes:
      - app-data:/data
    depends_on:
      - valkey
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  worker:
    build: .
    environment:
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      - DATA_DIR=/data
      - ARQ_MAX_JOBS=4
    volumes:
      - app-data:/data
    depends_on:
      - valkey
    command: arq services.worker.WorkerSettings
    restart: unless-stopped
    deploy:
      replicas: 2  # Run 2 worker instances for parallel processing

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    command: valkey-server --appendonly yes
    restart: unless-stopped

volumes:
  app-data:
  valkey-data:
