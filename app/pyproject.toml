[project]
name = "lucidlink-labs"
version = "0.1.0"
description = "S3 to LucidLink Integrator Web UI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.3",
    "httpx>=0.26.0",
    "boto3>=1.34.0",
    "keyring>=25.0.0",
    "arq>=0.26.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib>=1.7.4",
    "bcrypt>=4.0.0,<4.2.0",
]

[tool.setuptools]
packages = ["services"]
py-modules = ["main"]
