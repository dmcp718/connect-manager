<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LucidLink Labs: CONNECT Manager</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <!-- Custom Aeonik font -->
    <style>
        @font-face {
            font-family: 'Aeonik';
            src: url('/static/fonts/Aeonik-Medium.otf') format('opentype');
            font-weight: 500;
            font-style: normal;
        }
        @font-face {
            font-family: 'Aeonik';
            src: url('/static/fonts/Aeonik-Bold.otf') format('opentype');
            font-weight: 700;
            font-style: normal;
        }
    </style>

    <!-- Main CSS -->
    <link rel="stylesheet" href="/static/css/style.css?v=2">

    <!-- Alpine.js cloak - hide elements until Alpine initializes -->
    <style>[x-cloak] { display: none !important; }</style>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/sse.js"></script>

    <!-- Alpine.js for minor interactivity -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="{
    activeTab: 'settings',
    modal: { open: false, loading: false },
    openModal() { this.modal.open = true; },
    closeModal() { this.modal.open = false; this.modal.loading = false; }
}">
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <img src="/static/img/lab_flask.svg" alt="Lab Flask" class="header-icon">
            <h1 class="header-title">LucidLink Labs: CONNECT Manager</h1>
        </div>
        <div class="header-right" x-data="{ userMenuOpen: false }">
            {% if user_email %}
            <div class="user-menu">
                <button class="user-menu-btn" @click="userMenuOpen = !userMenuOpen" @click.away="userMenuOpen = false">
                    <span class="user-email">{{ user_email }}</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6,9 12,15 18,9"></polyline>
                    </svg>
                </button>
                <div class="user-dropdown" x-show="userMenuOpen" x-cloak>
                    {% if is_admin %}
                    <a href="#" class="dropdown-item" hx-get="/api/tab/users" hx-target="#tab-content" @click="userMenuOpen = false; activeTab = 'users'">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        Manage users
                    </a>
                    {% endif %}
                    <button class="dropdown-item"
                        hx-get="/api/auth/change-password-modal"
                        hx-target="#modal-container"
                        hx-swap="innerHTML"
                        @click="userMenuOpen = false; openModal()"
                    >
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        Change password
                    </button>
                    <button class="dropdown-item" @click="
                        fetch('/api/auth/logout', { method: 'POST' })
                        .then(() => window.location.href = '/login')
                    ">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        Sign out
                    </button>
                </div>
            </div>
            {% endif %}
        </div>
    </header>

    <!-- Main Layout -->
    <div class="layout-single">
        <!-- Main Content -->
        <main class="main-content">
            <!-- Tabs -->
            <div class="tabs">
                <button
                    class="tab"
                    :class="{ 'active': activeTab === 'settings' }"
                    @click="activeTab = 'settings'"
                    hx-get="/api/tab/settings"
                    hx-target="#tab-content"
                    hx-swap="innerHTML"
                >
                    Settings
                </button>
                <button
                    class="tab"
                    :class="{ 'active': activeTab === 'browser' }"
                    @click="activeTab = 'browser'"
                    hx-get="/api/tab/browser"
                    hx-target="#tab-content"
                    hx-swap="innerHTML"
                >
                    S3 Browser
                </button>
                <button
                    class="tab"
                    :class="{ 'active': activeTab === 'jobs' }"
                    @click="activeTab = 'jobs'"
                    hx-get="/api/jobs"
                    hx-target="#tab-content"
                    hx-swap="innerHTML"
                >
                    Jobs
                </button>
                <button
                    class="tab"
                    :class="{ 'active': activeTab === 'sqs' }"
                    @click="activeTab = 'sqs'"
                    hx-get="/api/tab/sqs"
                    hx-target="#tab-content"
                    hx-swap="innerHTML"
                >
                    AWS SQS
                </button>
                <button
                    class="tab"
                    :class="{ 'active': activeTab === 'logs' }"
                    @click="activeTab = 'logs'"
                    hx-get="/api/tab/logs"
                    hx-target="#tab-content"
                    hx-swap="innerHTML"
                >
                    Logs
                </button>
                <button
                    class="tab"
                    :class="{ 'active': activeTab === 'help' }"
                    @click="activeTab = 'help'"
                    hx-get="/api/tab/help"
                    hx-target="#tab-content"
                    hx-swap="innerHTML"
                >
                    Help
                </button>
            </div>

            <!-- Tab Content -->
            <div id="tab-content" class="tab-content">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <!-- Modal Container - Alpine.js controlled -->
    <div
        id="modal-overlay"
        class="modal-backdrop"
        x-show="modal.open"
        x-cloak
        @click.self="closeModal()"
        @keydown.escape.window="closeModal()"
    >
        <div id="modal-container" class="modal" @click.stop>
            <!-- Modal content loaded via HTMX -->
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- SSE Listeners -->
    <script>
        // Track how many logs the server has rendered (synced on tab load)
        window.serverLogCount = 0;

        // Logs SSE - append new logs to container, or queue them if tab not visible
        window.pendingLogs = [];

        function appendLog(message) {
            const logsContent = document.getElementById('logs-content');
            if (logsContent) {
                const logEntry = document.createElement('div');
                logEntry.className = 'log-entry';
                logEntry.textContent = message;
                logsContent.appendChild(logEntry);
                logsContent.scrollTop = logsContent.scrollHeight;
            } else {
                // Tab not visible, queue the log
                window.pendingLogs.push(message);
            }
        }

        function flushPendingLogs() {
            const logsContent = document.getElementById('logs-content');
            if (logsContent && window.pendingLogs.length > 0) {
                for (const msg of window.pendingLogs) {
                    const logEntry = document.createElement('div');
                    logEntry.className = 'log-entry';
                    logEntry.textContent = msg;
                    logsContent.appendChild(logEntry);
                }
                logsContent.scrollTop = logsContent.scrollHeight;
                window.pendingLogs = [];
            }
        }

        // Logs SSE
        const logsSource = new EventSource('/api/logs/stream');
        let sseLogIndex = 0;

        logsSource.onmessage = function(event) {
            const data = JSON.parse(event.data);
            if (data.type === 'log') {
                sseLogIndex++;
                // Only render logs that arrive AFTER the server-rendered count
                if (sseLogIndex > window.serverLogCount) {
                    appendLog(data.message);
                }
            }
        };

        // When Logs tab loads, sync the count and flush pending
        document.body.addEventListener('htmx:afterSwap', function(event) {
            const logsContent = document.getElementById('logs-content');
            if (logsContent) {
                // Sync: server just rendered N logs, update our counter
                window.serverLogCount = logsContent.children.length;
                sseLogIndex = window.serverLogCount;
                // Flush any logs that arrived while tab was hidden
                flushPendingLogs();
            }
        });
    </script>
</body>
</html>
