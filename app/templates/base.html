<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LucidLink Labs: CONNECT Manager</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <!-- Custom Aeonik font -->
    <style>
        @font-face {
            font-family: 'Aeonik';
            src: url('/static/fonts/Aeonik-Medium.otf') format('opentype');
            font-weight: 500;
            font-style: normal;
        }
        @font-face {
            font-family: 'Aeonik';
            src: url('/static/fonts/Aeonik-Bold.otf') format('opentype');
            font-weight: 700;
            font-style: normal;
        }
    </style>

    <!-- Main CSS -->
    <link rel="stylesheet" href="/static/css/style.css">

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/sse.js"></script>

    <!-- Alpine.js for minor interactivity -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="{ activeTab: 'settings' }">
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <img src="/static/img/lab_flask.svg" alt="Lab Flask" class="header-icon">
            <h1 class="header-title">LucidLink Labs: CONNECT Manager</h1>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="layout-single">
        <!-- Main Content -->
        <main class="main-content">
            <!-- Tabs -->
            <div class="tabs">
                <button
                    class="tab"
                    :class="{ 'active': activeTab === 'settings' }"
                    @click="activeTab = 'settings'"
                    hx-get="/api/tab/settings"
                    hx-target="#tab-content"
                    hx-swap="innerHTML"
                >
                    Settings
                </button>
                <button
                    class="tab"
                    :class="{ 'active': activeTab === 'browser' }"
                    @click="activeTab = 'browser'"
                    hx-get="/api/tab/browser"
                    hx-target="#tab-content"
                    hx-swap="innerHTML"
                >
                    Browser
                </button>
                <button
                    class="tab"
                    :class="{ 'active': activeTab === 'jobs' }"
                    @click="activeTab = 'jobs'"
                    hx-get="/api/jobs"
                    hx-target="#tab-content"
                    hx-swap="innerHTML"
                >
                    Jobs
                </button>
                <button
                    class="tab"
                    :class="{ 'active': activeTab === 'logs' }"
                    @click="activeTab = 'logs'"
                    hx-get="/api/tab/logs"
                    hx-target="#tab-content"
                    hx-swap="innerHTML"
                >
                    Logs
                </button>
            </div>

            <!-- Tab Content -->
            <div id="tab-content" class="tab-content">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <!-- Modal Container -->
    <div id="modal-container"></div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- SSE Listeners -->
    <script>
        // Track how many logs the server has rendered (synced on tab load)
        window.serverLogCount = 0;

        // Logs SSE - append new logs to container, or queue them if tab not visible
        window.pendingLogs = [];

        function appendLog(message) {
            const logsContent = document.getElementById('logs-content');
            if (logsContent) {
                const logEntry = document.createElement('div');
                logEntry.className = 'log-entry';
                logEntry.textContent = message;
                logsContent.appendChild(logEntry);
                logsContent.scrollTop = logsContent.scrollHeight;
            } else {
                // Tab not visible, queue the log
                window.pendingLogs.push(message);
            }
        }

        function flushPendingLogs() {
            const logsContent = document.getElementById('logs-content');
            if (logsContent && window.pendingLogs.length > 0) {
                for (const msg of window.pendingLogs) {
                    const logEntry = document.createElement('div');
                    logEntry.className = 'log-entry';
                    logEntry.textContent = msg;
                    logsContent.appendChild(logEntry);
                }
                logsContent.scrollTop = logsContent.scrollHeight;
                window.pendingLogs = [];
            }
        }

        // Logs SSE
        const logsSource = new EventSource('/api/logs/stream');
        let sseLogIndex = 0;

        logsSource.onmessage = function(event) {
            const data = JSON.parse(event.data);
            if (data.type === 'log') {
                sseLogIndex++;
                // Only render logs that arrive AFTER the server-rendered count
                if (sseLogIndex > window.serverLogCount) {
                    appendLog(data.message);
                }
            }
        };

        // When Logs tab loads, sync the count and flush pending
        document.body.addEventListener('htmx:afterSwap', function(event) {
            const logsContent = document.getElementById('logs-content');
            if (logsContent) {
                // Sync: server just rendered N logs, update our counter
                window.serverLogCount = logsContent.children.length;
                sseLogIndex = window.serverLogCount;
                // Flush any logs that arrived while tab was hidden
                flushPendingLogs();
            }
        });
    </script>
</body>
</html>
