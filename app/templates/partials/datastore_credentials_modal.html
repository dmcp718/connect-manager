<div class="modal-backdrop" onclick="this.parentElement.innerHTML = ''">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3 class="modal-title">Enter AWS Credentials</h3>
            <button
                type="button"
                class="btn btn-ghost"
                onclick="document.getElementById('modal-container').innerHTML = ''"
            >
                <img src="/static/img/icons/x.svg" alt="Close" class="icon icon-sm icon-muted">
            </button>
        </div>
        <form
            hx-post="/api/datastores/{{ datastore_id }}/credentials"
            hx-target="#tab-content"
            hx-swap="innerHTML"
        >
            <div class="modal-body">
                <p class="text-muted" style="margin-bottom: var(--space-lg);">
                    Enter AWS credentials to browse the S3 bucket for DataStore <strong>{{ datastore_name }}</strong>.
                </p>

                <input type="hidden" name="datastore_id" value="{{ datastore_id }}">
                <input type="hidden" name="datastore_name" value="{{ datastore_name }}">
                <input type="hidden" name="filespace_id" value="{{ filespace_id }}">
                <input type="hidden" name="filespace_name" value="{{ filespace_name }}">
                <input type="hidden" name="bucket_name" value="{{ bucket_name }}">
                {% if region %}
                <input type="hidden" name="region" value="{{ region }}">
                {% endif %}
                {% if endpoint %}
                <input type="hidden" name="endpoint" value="{{ endpoint }}">
                {% endif %}

                <div class="form-group">
                    <label class="form-label" for="cred-access-key">Access key ID</label>
                    <input
                        type="text"
                        id="cred-access-key"
                        name="access_key"
                        class="form-input"
                        required
                        placeholder="AKIAIOSFODNN7EXAMPLE"
                    >
                </div>

                <div class="form-group" x-data="{ show: false }">
                    <label class="form-label" for="cred-secret-key">Secret access key</label>
                    <div class="input-password">
                        <input
                            :type="show ? 'text' : 'password'"
                            id="cred-secret-key"
                            name="secret_key"
                            class="form-input"
                            required
                            placeholder="wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
                        >
                        <button type="button" class="btn-eye" @click="show = !show" :title="show ? 'Hide' : 'Show'">
                            <svg x-show="!show" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            <svg x-show="show" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                        </button>
                    </div>
                </div>

                <div class="alert alert-warning" style="margin-top: var(--space-md);">
                    <strong>Note:</strong> Credentials are stored locally and used only for browsing this DataStore's S3 bucket.
                </div>
            </div>
            <div class="modal-footer">
                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="document.getElementById('modal-container').innerHTML = ''"
                >
                    Cancel
                </button>
                <button type="submit" class="btn btn-primary">
                    Save Credentials
                </button>
            </div>
        </form>
    </div>
</div>
