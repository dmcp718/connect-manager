<div class="sqs-container"
     hx-get="/api/tab/sqs"
     hx-trigger="every 30s"
     hx-swap="outerHTML">

    <!-- SQS Credentials Card -->
    <div class="card">
        <div class="card-header">
            <span class="card-icon"><img src="/static/img/icons/inbox.svg" alt=""></span>
            <h3 class="card-title">AWS credentials (SQS)</h3>
            <button
                class="btn btn-sm btn-ghost"
                hx-get="/api/sqs/iam-policy"
                hx-target="#modal-container"
                hx-swap="innerHTML"
                @click="openModal()"
                style="margin-left: auto;"
            >
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px;">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                View example IAM policy
            </button>
        </div>
        <div class="card-body">
            <p class="text-muted" style="margin-bottom: var(--space-md); font-size: 0.875rem;">
                Configure IAM credentials with SQS read permissions for event-driven imports.
            </p>

            <form class="sqs-credentials-form"
                  hx-post="/api/sqs/credentials"
                  hx-target="#sqs-queues-section"
                  hx-swap="outerHTML">

                <div class="form-row">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label" for="sqs_access_key">
                            Access key{% if sqs_credentials %} <span class="text-success">(saved)</span>{% endif %}
                        </label>
                        <input
                            type="text"
                            id="sqs_access_key"
                            name="access_key"
                            class="form-input"
                            value="{{ sqs_credentials.access_key if sqs_credentials else '' }}"
                            placeholder="AKIAIOSFODNN7EXAMPLE"
                            required
                        >
                    </div>
                </div>

                <div class="form-group" x-data="{ show: false }">
                    <label class="form-label" for="sqs_secret_key">Secret key</label>
                    <div class="input-password">
                        <input
                            :type="show ? 'text' : 'password'"
                            id="sqs_secret_key"
                            name="secret_key"
                            class="form-input"
                            placeholder="{% if sqs_credentials %}(unchanged){% else %}wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY{% endif %}"
                            {% if not sqs_credentials %}required{% endif %}
                        >
                        <button type="button" class="btn-eye" @click="show = !show" :title="show ? 'Hide' : 'Show'">
                            <svg x-show="!show" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            <svg x-show="show" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                        </button>
                    </div>
                </div>

                <div style="margin-top: var(--space-md);">
                    <button type="submit" class="btn btn-primary">
                        Save credentials
                    </button>
                    {% if sqs_credentials %}
                    <button
                        type="button"
                        class="btn btn-ghost"
                        hx-delete="/api/sqs/credentials"
                        hx-target="#tab-content"
                        hx-swap="innerHTML"
                        hx-confirm="Remove SQS credentials? All queue configurations will stop polling."
                    >
                        Remove
                    </button>
                    {% endif %}
                </div>

                <div id="sqs-creds-indicator" class="htmx-indicator">
                    <span class="spinner"></span> Saving...
                </div>
            </form>
        </div>
    </div>

    <!-- Configured Queues Section -->
    <div id="sqs-queues-section">
        {% include "partials/sqs_queue_list.html" %}
    </div>

    <!-- Recent Events Section (auto-refreshes every 5s) -->
    {% include "partials/sqs_events.html" %}
</div>
