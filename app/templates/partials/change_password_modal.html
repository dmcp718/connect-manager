<!-- Change Password Modal -->
<div class="modal-header">
    <h3>Change password</h3>
    <button class="modal-close" @click="closeModal()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
    </button>
</div>

<div class="modal-body">
    <form id="change-password-form" hx-post="/api/auth/change-password" hx-swap="innerHTML" hx-target="#password-result">
        <div class="form-group">
            <label for="current_password">Current password</label>
            <input
                type="password"
                id="current_password"
                name="current_password"
                required
                autocomplete="current-password"
            >
        </div>

        <div class="form-group">
            <label for="new_password">New password</label>
            <input
                type="password"
                id="new_password"
                name="new_password"
                required
                minlength="8"
                autocomplete="new-password"
            >
            <small class="form-hint">Minimum 8 characters, with uppercase, lowercase, and a number</small>
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm new password</label>
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                required
                minlength="8"
                autocomplete="new-password"
            >
        </div>

        <div id="password-result"></div>

        <div class="modal-actions">
            <button type="button" class="btn btn-secondary" @click="closeModal()">Cancel</button>
            <button type="submit" class="btn btn-primary" id="change-pwd-btn">Change password</button>
        </div>
    </form>
</div>

<script>
    // Validate password match before submit
    document.getElementById('change-password-form').addEventListener('submit', function(e) {
        const newPwd = document.getElementById('new_password').value;
        const confirmPwd = document.getElementById('confirm_password').value;
        const resultDiv = document.getElementById('password-result');

        if (newPwd !== confirmPwd) {
            e.preventDefault();
            resultDiv.innerHTML = '<div class="alert alert-error">Passwords do not match</div>';
            return false;
        }
    });

    // Handle successful password change
    document.body.addEventListener('htmx:afterRequest', function(e) {
        if (e.detail.target.id === 'password-result' && e.detail.successful) {
            const response = JSON.parse(e.detail.xhr.response);
            if (response.status === 'success') {
                document.getElementById('password-result').innerHTML =
                    '<div class="alert alert-success">Password changed successfully. Redirecting to login...</div>';
                setTimeout(() => window.location.href = '/login', 2000);
            }
        }
    });
</script>
