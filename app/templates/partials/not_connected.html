<div class="not-connected">
    <div class="not-connected-icon">
        <img src="/static/img/icons/folder.svg" alt="" class="icon icon-xl icon-muted">
    </div>
    <h3 class="not-connected-title">No DataStores configured</h3>
    <p class="not-connected-text">
        Connect to a LucidLink filespace and create or select a DataStore to start browsing S3 content.
    </p>
    <button
        class="btn btn-primary"
        onclick="document.querySelector('[x-data]').__x.$data.activeTab = 'settings'"
        hx-get="/api/tab/settings"
        hx-target="#tab-content"
        hx-swap="innerHTML"
    >
        Go to Settings
    </button>
</div>
